kind: PersistentVolume
apiVersion: v1
metadata:
  name: postgres-sharry-volume
  namespace: sharry
spec:
  storageClassName: nfs
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: "/watermelon-pool/encrypted/sharry"
    server: watermelon
