---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sharry
resources:
- deployment.yaml
- ingressroute.yaml
- namespace.yaml
- service.yaml
- postgres.yaml
- pv.yaml
- pvc.yaml
- config-map.yaml
secretGenerator:
- name: postgres-secrets
  envs:
  - .env.postgres
- name: sharry-secrets
  envs:
  - .env.sharry
